<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#050505">

<meta name="apple-mobile-web-app-title" content="TEAM WOLFPACK">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<title>Pack Chat | Team Wolfpack</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  padding-bottom:95px;

  background:
    radial-gradient(
      circle at 0% 15%,
      rgba(0,190,255,.22),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 35%,
      rgba(255,85,0,.22),
      transparent 30%
    ),
    linear-gradient(
      115deg,
      #02090d 0%,
      #050505 50%,
      #150802 100%
    );
}

.header{
  text-align:center;
  padding:25px 18px 18px;
}

.logo{
  width:95px;
  height:95px;
  object-fit:contain;
}

.brand{
  margin-top:5px;
  font-size:12px;
  font-weight:900;
  letter-spacing:4px;
  color:#67dcff;
}

.title{
  margin-top:18px;
  font-size:31px;
  font-weight:900;
}

.ice{
  color:#67dcff;
}

.fire{
  color:#ff751c;
}

.subtitle{
  margin-top:8px;
  color:#aaa;
  font-size:12px;
  line-height:1.5;
}

.line{
  width:100%;
  max-width:430px;
  height:2px;
  margin:20px auto 0;

  background:
    linear-gradient(
      90deg,
      #4bd8ff,
      transparent,
      #ff6200
    );
}

.content{
  width:100%;
  max-width:540px;
  margin:auto;
  padding:8px 16px 110px;
}

.status{
  text-align:center;
  margin-bottom:12px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  color:#aaa;
}

.status.connected{
  color:#67dcff;
}

.status.admin{
  color:#ff751c;
}

.status.warning{
  color:#ffb347;
}

.status.blocked{
  color:#ff5a32;
}

.status.error{
  color:#ff751c;
}

.moderation-notice{
  display:none;
  margin-bottom:14px;
  padding:14px;
  text-align:center;
  border-radius:12px;
  font-size:10px;
  font-weight:900;
  line-height:1.5;
}

.moderation-notice.muted{
  display:block;
  color:#ffb347;
  border:1px solid rgba(255,180,71,.35);
  background:rgba(90,55,0,.25);
}

.moderation-notice.blocked{
  display:block;
  color:#ff7957;
  border:1px solid rgba(255,90,50,.40);
  background:rgba(90,20,0,.30);
}

.error-details{
  display:none;
  margin-bottom:14px;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,117,28,.45);
  background:rgba(80,20,0,.30);
  color:#ffb37a;
  font-size:10px;
  line-height:1.5;
  word-break:break-word;
}

.error-details.show{
  display:block;
}

.error-title{
  color:#ff751c;
  font-weight:900;
  margin-bottom:6px;
}

.report-success{
  display:none;
  margin-bottom:14px;
  padding:13px;
  border-radius:10px;
  text-align:center;
  color:#67dcff;
  background:rgba(0,150,210,.10);
  border:1px solid rgba(103,220,255,.25);
  font-size:10px;
  font-weight:900;
}

.report-success.show{
  display:block;
}

.name-box{
  padding:18px;
  margin-bottom:14px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.12);

  background:
    linear-gradient(
      110deg,
      rgba(20,150,205,.15),
      rgba(8,8,8,.94) 50%,
      rgba(220,70,0,.15)
    );
}

.name-title{
  font-size:14px;
  font-weight:900;
  color:#67dcff;
  margin-bottom:6px;
}

.name-info{
  color:#aaa;
  font-size:11px;
  line-height:1.5;
  margin-bottom:12px;
}

.name-row{
  display:flex;
  gap:8px;
}

input,
textarea,
button,
select{
  font-family:inherit;
}

.name-input,
.admin-input,
.report-select{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid rgba(255,255,255,.16);
  outline:none;
  color:#fff;
  background:#080808;
  font-size:13px
