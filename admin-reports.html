<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<meta name="theme-color" content="#050505">

<title>Admin Reports | Team Wolfpack</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:#fff;
  padding-bottom:40px;

  background:
    radial-gradient(
      circle at 0% 15%,
      rgba(0,190,255,.22),
      transparent 30%
    ),
    radial-gradient(
      circle at 100% 35%,
      rgba(255,85,0,.22),
      transparent 30%
    ),
    linear-gradient(
      115deg,
      #02090d 0%,
      #050505 50%,
      #150802 100%
    );
}


/* HEADER */

.header{
  text-align:center;
  padding:25px 18px 18px;
}

.logo{
  width:95px;
  height:95px;
  object-fit:contain;
}

.brand{
  margin-top:5px;
  font-size:12px;
  font-weight:900;
  letter-spacing:4px;
  color:#67dcff;
}

.title{
  margin-top:18px;
  font-size:28px;
  font-weight:900;
}

.ice{
  color:#67dcff;
}

.fire{
  color:#ff751c;
}

.subtitle{
  margin-top:8px;
  color:#999;
  font-size:11px;
}

.line{
  width:100%;
  max-width:430px;
  height:2px;
  margin:20px auto 0;

  background:
    linear-gradient(
      90deg,
      #4bd8ff,
      transparent,
      #ff6200
    );
}


/* MAIN */

.content{
  width:100%;
  max-width:600px;
  margin:auto;
  padding:8px 16px 50px;
}


/* STATUS */

.status{
  text-align:center;
  margin-bottom:15px;
  padding:10px;
  font-size:10px;
  font-weight:900;
  letter-spacing:1px;
  color:#aaa;
}

.status.admin{
  color:#ff751c;
}

.status.error{
  color:#ff751c;
}


/* ACCESS DENIED */

.access-denied{
  display:none;
  padding:25px 18px;
  border-radius:14px;
  text-align:center;

  border:
    1px solid rgba(255,117,28,.35);

  background:
    rgba(50,10,0,.35);
}

.access-denied.show{
  display:block;
}

.access-title{
  color:#ff751c;
  font-size:18px;
  font-weight:900;
}

.access-text{
  margin-top:10px;
  color:#aaa;
  font-size:11px;
  line-height:1.6;
}


/* ADMIN HEADER */

.admin-bar{
  display:none;

  align-items:center;
  justify-content:space-between;
  gap:10px;

  margin-bottom:15px;
  padding:14px 16px;

  border-radius:12px;

  border:
    1px solid rgba(255,117,28,.35);

  background:
    linear-gradient(
      90deg,
      rgba(0,150,210,.12),
      rgba(255,90,0,.16)
    );
}

.admin-bar.show{
  display:flex;
}

.admin-name{
  font-size:11px;
  font-weight:900;
}

.admin-badge{
  display:inline-block;
  margin-left:6px;
  padding:4px 7px;
  border-radius:20px;

  background:#ff751c;
  color:#050505;

  font-size:8px;
  font-weight:900;
}


/* COUNTER */

.report-count{
  display:none;

  margin-bottom:14px;
  padding:13px;

  text-align:center;

  border-radius:10px;

  border:
    1px solid rgba(103,220,255,.20);

  background:
    rgba(0,150,210,.08);

  color:#67dcff;

  font-size:10px;
  font-weight:900;
}

.report-count.show{
  display:block;
}


/* REPORTS */

.reports{
  display:none;
}

.reports.show{
  display:block;
}

.empty{
  padding:35px 20px;

  text-align:center;

  border-radius:14px;

  border:
    1px solid rgba(255,255,255,.10);

  background:
    rgba(8,8,8,.75);

  color:#777;

  font-size:12px;
  line-height:1.6;
}


/* REPORT CARD */

.report-card{
  margin-bottom:14px;
  padding:17px;

  border-radius:14px;

  border:
    1px solid rgba(255,117,28,.25);

  background:
    linear-gradient(
      110deg,
      rgba(0,150,210,.08),
      rgba(8,8,8,.95) 48%,
      rgba(255,90,0,.10)
    );
}

.report-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.report-reason{
  color:#ff751c;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}

.report-time{
  color:#666;
  font-size:8px;
}

.label{
  margin-top:14px;

  color:#67dcff;

  font-size:8px;
  font-weight:900;
  letter-spacing:1px;
}

.value{
  margin-top:4px;

  color:#aaa;

  font-size:10px;

  line-height:1.5;

  word-break:break-word;
}

.reported-message{
  margin-top:8px;
  padding:12px;

  border-radius:9px;

  background:#111;

  border:
    1px solid rgba(255,255,255,.08);

  color:#eee;

  font-size:12px;

  line-height:1.5;
}


/* BUTTONS */

.actions{
  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:8px;

  margin-top:15px;
}

.delete-button,
.dismiss-button{
  padding:12px 8px;

  border-radius:9px;

  cursor:pointer;

  font-size:9px;
  font-weight:900;
}

.delete-button{
  border:none;

  color:#fff;

  background:
    linear-gradient(
      135deg,
      #ff751c,
      #bd4000
    );
}

.dismiss-button{
  border:
    1px solid rgba(103,220,255,.30);

  color:#67dcff;

  background:
    rgba(0,150,210,.06);
}

button:disabled{
  opacity:.4;
  cursor:not-allowed;
}


/* BACK */

.back{
  display:block;

  margin-top:16px;

  padding:15px;

  text-align:center;

  text-decoration:none;

  color:#fff;

  border:
    1px solid #59d9ff;

  border-radius:11px;

  font-size:11px;

  font-weight:900;

  letter-spacing:1px;

  background:
    linear-gradient(
      90deg,
      rgba(0,160,220,.10),
      rgba(255,90,0,.10)
    );
}

</style>

</head>


<body>


<header class="header">

<a href="index.html">

<img
  src="icon-512.png"
  class="logo"
  alt="Team Wolfpack"
>

</a>

<div class="brand">
TEAM WOLFPACK
</div>

<h1 class="title">

<span class="ice">
ADMIN
</span>

<span class="fire">
REPORTS
</span>

</h1>

<p class="subtitle">
Pack Chat moderation centre
</p>

<div class="line"></div>

</header>


<main class="content">


<div
  id="status"
  class="status"
>
CHECKING ADMIN ACCESS...
</div>


<div
  id="accessDenied"
  class="access-denied"
>

<div class="access-title">
ADMIN ACCESS REQUIRED
</div>

<div class="access-text">
Sign into Pack Chat using an authorised Team Wolfpack administrator account before opening Admin Reports.
</div>

<a
  class="back"
  href="chat.html"
>
RETURN TO PACK CHAT
</a>

</div>


<div
  id="adminBar"
  class="admin-bar"
>

<div class="admin-name">

<span id="adminName"></span>

<span class="admin-badge">
ADMIN
</span>

</div>

<div>
MODERATION
</div>

</div>


<div
  id="reportCount"
  class="report-count"
></div>


<div
  id="reports"
  class="reports"
></div>


<a
  id="backButton"
  class="back"
  href="chat.html"
  style="display:none;"
>
‹ BACK TO PACK CHAT
</a>


</main>


<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";


import {
  getAuth,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";


import {
  getFirestore,
  collection,
  query,
  orderBy,
  onSnapshot,
  deleteDoc,
  doc
} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";


const firebaseConfig = {

  apiKey:
    "AIzaSyC06RDrqpXodbYBJqyeGvRkmtxQGapaaPY",

  authDomain:
    "team-wolfpack-app.firebaseapp.com",

  projectId:
    "team-wolfpack-app",

  storageBucket:
    "team-wolfpack-app.firebasestorage.app",

  messagingSenderId:
    "1070414578856",

  appId:
    "1:1070414578856:web:df14e7d387e658eeae2e9d",

  measurementId:
    "G-6JTCE2N9LZ"

};


/* TEAM WOLFPACK ADMINS */

const ADMINS = {

  "PRGa9TsCW0QDn1QtoUXyYjEi7YB3":
    "MR WOLFIE",

  "SlpEQYl94DaH6j42QUyl8Kv2ujJ3":
    "MRS WOLFIE"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);

const db =
  getFirestore(app);


/* ELEMENTS */

const status =
  document.getElementById("status");

const accessDenied =
  document.getElementById("accessDenied");

const adminBar =
  document.getElementById("adminBar");

const adminName =
  document.getElementById("adminName");

const reportCount =
  document.getElementById("reportCount");

const reports =
  document.getElementById("reports");

const backButton =
  document.getElementById("backButton");


let currentAdmin = null;

let unsubscribeReports = null;


/* ESCAPE */

function escapeHTML(value){

  const element =
    document.createElement("div");

  element.textContent =
    value || "";

  return element.innerHTML;

}


/* DATE */

function displayDate(timestamp){

  if(!timestamp){

    return "Processing...";

  }

  try{

    return timestamp
      .toDate()
      .toLocaleString(
        [],
        {
          day:"2-digit",
          month:"short",
          year:"numeric",
          hour:"2-digit",
          minute:"2-digit"
        }
      );

  }catch(error){

    return "";

  }

}


/* DELETE REPORTED MESSAGE */

async function deleteReportedMessage(
  messageId,
  reportId
){

  if(!currentAdmin){

    return;

  }


  const confirmed =
    window.confirm(
      "Delete this message from Pack Chat?\n\nThe report will also be removed."
    );


  if(!confirmed){

    return;

  }


  try{

    /*
      Delete original chat message.
    */

    await deleteDoc(
      doc(
        db,
        "messages",
        messageId
      )
    );


    /*
      Delete report after moderation.
    */

    await deleteDoc(
      doc(
        db,
        "reports",
        reportId
      )
    );


  }catch(error){

    console.error(error);

    window.alert(
      "Unable to delete the message. Please try again."
    );

  }

}


/* DISMISS REPORT */

async function dismissReport(
  reportId
){

  if(!currentAdmin){

    return;

  }


  const confirmed =
    window.confirm(
      "Dismiss this report without deleting the Pack Chat message?"
    );


  if(!confirmed){

    return;

  }


  try{

    await deleteDoc(
      doc(
        db,
        "reports",
        reportId
      )
    );


  }catch(error){

    console.error(error);

    window.alert(
      "Unable to dismiss the report."
    );

  }

}


/* REPORT LISTENER */

function startReports(){

  if(unsubscribeReports){

    unsubscribeReports();

  }


  const reportsQuery =
    query(
      collection(
        db,
        "reports"
      ),
      orderBy(
        "createdAt",
        "desc"
      )
    );


  unsubscribeReports =
    onSnapshot(

      reportsQuery,


      function(snapshot){

        reportCount.classList.add(
          "show"
        );


        reports.classList.add(
          "show"
        );


        const total =
          snapshot.size;


        reportCount.textContent =
          total === 1
            ? "1 REPORT REQUIRES REVIEW"
            : total +
              " REPORTS REQUIRE REVIEW";


        if(snapshot.empty){

          reports.innerHTML =
            '<div class="empty">' +
            'NO REPORTS<br><br>' +
            'There are currently no Pack Chat reports requiring review.' +
            '</div>';

          return;

        }


        let html =
          "";


        snapshot.forEach(
          function(reportSnapshot){

            const data =
              reportSnapshot.data();


            html +=

              '<div class="report-card">' +


              '<div class="report-top">' +

              '<div class="report-reason">' +
              escapeHTML(
                data.reason ||
                "Reported"
              ) +
              '</div>' +

              '<div class="report-time">' +
              displayDate(
                data.createdAt
              ) +
              '</div>' +

              '</div>' +


              '<div class="label">' +
              'REPORTED PACK MEMBER' +
              '</div>' +

              '<div class="value">' +
              escapeHTML(
                data.messageName ||
                "Pack Member"
              ) +
              '</div>' +


              '<div class="label">' +
              'REPORTED MESSAGE' +
              '</div>' +

              '<div class="reported-message">' +
              escapeHTML(
                data.messageText ||
                ""
              ) +
              '</div>' +


              '<div class="label">' +
              'MESSAGE ID' +
              '</div>' +

              '<div class="value">' +
              escapeHTML(
                data.messageId ||
                ""
              ) +
              '</div>' +


              '<div class="actions">' +


              '<button ' +
              'class="delete-button" ' +
              'type="button" ' +
              'data-action="delete" ' +
              'data-message-id="' +
              escapeHTML(
                data.messageId ||
                ""
              ) +
              '" ' +
              'data-report-id="' +
              reportSnapshot.id +
              '">' +
              'DELETE MESSAGE' +
              '</button>' +


              '<button ' +
              'class="dismiss-button" ' +
              'type="button" ' +
              'data-action="dismiss" ' +
              'data-report-id="' +
              reportSnapshot.id +
              '">' +
              'DISMISS REPORT' +
              '</button>' +


              '</div>' +


              '</div>';

          }
        );


        reports.innerHTML =
          html;


        reports
          .querySelectorAll(
            '[data-action="delete"]'
          )
          .forEach(
            function(button){

              button.addEventListener(
                "click",
                function(){

                  deleteReportedMessage(

                    button.dataset.messageId,

                    button.dataset.reportId

                  );

                }
              );

            }
          );


        reports
          .querySelectorAll(
            '[data-action="dismiss"]'
          )
          .forEach(
            function(button){

              button.addEventListener(
                "click",
                function(){

                  dismissReport(
                    button.dataset.reportId
                  );

                }
              );

            }
          );

      },


      function(error){

        console.error(error);

        status.textContent =
          "UNABLE TO LOAD REPORTS";

        status.className =
          "status error";

      }

    );

}


/* AUTH CHECK */

onAuthStateChanged(
  auth,
  function(user){

    if(
      user &&
      ADMINS[user.uid]
    ){

      currentAdmin =
        user;


      const name =
        ADMINS[user.uid];


      status.textContent =
        "● " +
        name +
        " • ADMIN CONNECTED";


      status.className =
        "status admin";


      adminName.textContent =
        name;


      adminBar.classList.add(
        "show"
      );


      accessDenied.classList.remove(
        "show"
      );


      backButton.style.display =
        "block";


      startReports();


      return;

    }


    currentAdmin =
      null;


    status.textContent =
      "ADMIN ACCESS REQUIRED";


    status.className =
      "status error";


    adminBar.classList.remove(
      "show"
    );


    reportCount.classList.remove(
      "show"
    );


    reports.classList.remove(
      "show"
    );


    backButton.style.display =
      "none";


    accessDenied.classList.add(
      "show"
    );

  }
);

</script>


</body>

</html>
