<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  min-height:100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color:#fff;

  padding-bottom:95px;

  background:
    radial-gradient(
      circle at 0% 20%,
      rgba(0,190,255,.20),
      transparent 35%
    ),
    radial-gradient(
      circle at 100% 75%,
      rgba(255,90,0,.22),
      transparent 35%
    ),
    #050505;
}


/* HEADER */

.header{
  text-align:center;
  padding:28px 20px 15px;
}

.logo{
  width:105px;
  height:105px;
  object-fit:contain;
  margin-bottom:8px;
}

.brand{
  font-size:15px;
  font-weight:900;
  letter-spacing:3px;

  background:
    linear-gradient(
      90deg,
      #73dcff,
      #dffaff 45%,
      #ff7218 55%,
      #ffad42
    );

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  background-clip:text;
}

.page-title{
  font-size:31px;
  font-weight:900;
  letter-spacing:2px;
  margin-top:20px;
}

.page-title .ice{
  color:#65d9ff;
}

.page-title .fire{
  color:#ff751c;
}

.subtitle{
  margin-top:8px;
  color:#aaa;
  font-size:13px;
}

.line{
  max-width:430px;
  height:2px;
  margin:22px auto;

  background:
    linear-gradient(
      90deg,
      #48d6ff,
      transparent,
      #ff6200
    );
}


/* CONTENT */

.content{
  width:100%;
  max-width:540px;
  margin:auto;
  padding:0 18px 110px;
}


/* FIGHTER CARDS */

.fighter{
  display:block;
  position:relative;

  width:100%;
  min-height:190px;

  padding:
    28px
    165px
    28px
    22px;

  margin-bottom:18px;

  text-decoration:none;
  color:#fff;

  border-radius:16px;
  overflow:hidden;

  background:
    linear-gradient(
      110deg,
      rgba(22,155,210,.20),
      rgba(12,12,12,.94) 48%,
      rgba(225,73,0,.20)
    );

  border:
    1px solid rgba(255,255,255,.14);

  box-shadow:
    0 10px 30px rgba(0,0,0,.4);
}

.fighter::before{
  content:"";

  position:absolute;

  left:0;
  top:0;
  bottom:0;

  width:4px;

  background:#4dd8ff;

  z-index:4;
}

.fighter::after{
  content:"";

  position:absolute;

  right:0;
  top:0;
  bottom:0;

  width:4px;

  background:#ff6500;

  z-index:4;
}


/* FIGHTER PHOTOS */

.fighter-photo{
  position:absolute;

  right:0;
  top:0;

  width:145px;
  height:100%;

  display:block;

  object-fit:cover;
  object-position:center top;

  z-index:1;

  -webkit-mask-image:
    linear-gradient(
      to left,
      rgba(0,0,0,1) 72%,
      rgba(0,0,0,.9) 82%,
      rgba(0,0,0,0) 100%
    );

  mask-image:
    linear-gradient(
      to left,
      rgba(0,0,0,1) 72%,
      rgba(0,0,0,.9) 82%,
      rgba(0,0,0,0) 100%
    );
}


/* TEXT */

.team,
.name,
.role,
.view{
  position:relative;
  z-index:3;
}

.team{
  font-size:11px;
  font-weight:900;
  letter-spacing:3px;
  color:#67dbff;
  margin-bottom:8px;
}

.name{
  font-size:20px;
  font-weight:900;
  letter-spacing:.5px;
  line-height:1.15;
}

.role{
  margin-top:8px;

  color:#d0d0d0;

  font-size:13px;
  line-height:1.4;
}

.view{
  margin-top:20px;

  font-size:10px;
  font-weight:900;

  letter-spacing:1.5px;

  color:#ff7b22;
}

.arrow{
  position:absolute;

  right:14px;
  top:50%;

  transform:translateY(-50%);

  z-index:5;

  color:#ff761b;

  font-size:28px;
}


/* BOTTOM NAV */

.bottom-nav{
  position:fixed;

  left:0;
  right:0;
  bottom:0;

  height:74px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  padding-bottom:
    env(safe-area-inset-bottom);

  background:
    rgba(4,4,4,.97);

  border-top:
    1px solid rgba(255,255,255,.12);

  backdrop-filter:
    blur(12px);

  z-index:100;
}

.nav-item{
  text-decoration:none;

  color:#888;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:5px;

  font-size:9px;

  font-weight:bold;
}

.nav-icon{
  font-size:20px;
}

.nav-item.active{
  color:#63d9ff;
}

.fire-nav{
  color:#ff7420;
}


/* SMALL PHONES */

@media(max-width:430px){

  .fighter{
    min-height:175px;

    padding:
      24px
      142px
      24px
      18px;
  }

  .fighter-photo{
    width:128px;
  }

  .name{
    font-size:18px;
  }

  .team{
    font-size:9px;
    letter-spacing:2px;
  }

  .role{
    font-size:12px;
  }

  .view{
    font-size:9px;
  }

}

</style>

</head>
